name: Update weekly menu

on:
  schedule:
    - cron: '10 23 * * *' # 08:10 KST; retry daily if the official image is posted late
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verifier
        run: pip install pillow
      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_frontend.cjs
      - run: python scripts/update-menu.py
      - name: Commit official menu or pending review state when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh official weekly meal image"
            git push
          fi
