name: Update weekly menu

on:
  schedule:
    - cron: '10 23 * * 0'
    - cron: '10 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Korean OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor
          pip install pillow pytesseract
      - run: python scripts/update-menu.py
      - name: Commit updated menu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menu.json
          git diff --cached --quiet || git commit -m "chore: check weekly meal menu"
          git push
