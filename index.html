<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2">
  <meta name="description" content="경희대학교 국제캠퍼스 학생회관 오늘·내일 식단">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>오늘 뭐 먹지?</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f5f2;
      --card: #fff;
      --ink: #242321;
      --muted: #77736d;
      --line: rgba(36,35,33,.11);
      --accent: #19724b;
      --accent-soft: #e8f3ed;
      --shadow: 0 12px 36px rgba(46,42,36,.07), 0 2px 8px rgba(46,42,36,.035);
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--ink);
      background: var(--paper);
      font-family: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, a { -webkit-tap-highlight-color: transparent; }
    .shell { width: min(100% - 32px, 720px); margin: 0 auto; padding: 30px 0 max(36px, env(safe-area-inset-bottom)); }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .11em; }
    h1 { margin: 0; font-size: clamp(30px, 8vw, 44px); line-height: 1.05; letter-spacing: -.055em; }
    .source-link { min-width: 44px; min-height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--ink); background: rgba(255,255,255,.6); text-decoration: none; font-size: 19px; }
    .day-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; margin-bottom: 18px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,.5); }
    .day-tab { min-height: 50px; border: 0; border-radius: 11px; color: var(--muted); background: transparent; font: inherit; font-weight: 750; cursor: pointer; }
    .day-tab[aria-selected="true"] { color: var(--ink); background: var(--card); box-shadow: 0 2px 9px rgba(46,42,36,.08); }
    .date-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 2px 12px; }
    .date-line h2 { margin: 0; font-size: 18px; letter-spacing: -.025em; }
    .date-line span { color: var(--muted); font-size: 13px; }
    .meal-list { display: grid; gap: 10px; }
    .meal { display: grid; grid-template-columns: 78px minmax(0,1fr); gap: 16px; align-items: center; min-height: 76px; padding: 15px 17px; border: 1px solid var(--line); border-radius: 17px; background: var(--card); box-shadow: var(--shadow); }
    .meal-kind { align-self: stretch; display: flex; flex-direction: column; justify-content: center; border-right: 1px solid var(--line); }
    .meal-kind strong { font-size: 13px; color: var(--accent); }
    .meal-kind small { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .meal-name { margin: 0; font-size: 17px; font-weight: 750; line-height: 1.35; letter-spacing: -.02em; overflow-wrap: anywhere; }
    .meal-detail { margin: 5px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .empty, .error { padding: 38px 22px; border: 1px dashed var(--line); border-radius: 17px; color: var(--muted); background: rgba(255,255,255,.45); text-align: center; line-height: 1.65; }
    footer { margin-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.6; text-align: center; }
    .status { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    @media (min-width: 680px) {
      .shell { padding-top: 54px; }
      .meal-list { grid-template-columns: 1fr 1fr; }
      .meal { grid-template-columns: 72px minmax(0,1fr); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .day-tab { transition: background-color .16s ease, color .16s ease, box-shadow .16s ease; }
      .meal { animation: enter .25s ease both; }
      @keyframes enter { from { opacity: 0; transform: translateY(4px); } }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">KHU INTERNATIONAL CAMPUS</p>
        <h1>오늘 뭐 먹지?</h1>
      </div>
      <a class="source-link" href="https://khucoop.com/food-menu/" target="_blank" rel="noreferrer" aria-label="생협 원문 열기">↗</a>
    </header>

    <nav class="day-tabs" aria-label="날짜 선택">
      <button class="day-tab" type="button" data-offset="0" aria-selected="true">오늘</button>
      <button class="day-tab" type="button" data-offset="1" aria-selected="false">내일</button>
    </nav>

    <section aria-live="polite">
      <div class="date-line"><h2 id="selected-date">불러오는 중</h2><span id="meal-count"></span></div>
      <div class="meal-list" id="meal-list"><div class="empty">이번 주 식단을 불러오고 있어요.</div></div>
    </section>

    <footer>
      <span class="status">주간 자동 갱신</span><br>
      <span id="updated-at"></span> · 메뉴는 현장 사정에 따라 달라질 수 있습니다.
    </footer>
  </main>
  <script>
    const list = document.querySelector('#meal-list');
    const dateLabel = document.querySelector('#selected-date');
    const countLabel = document.querySelector('#meal-count');
    const updatedLabel = document.querySelector('#updated-at');
    const tabs = [...document.querySelectorAll('.day-tab')];
    const seoulDate = offset => {
      const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date(Date.now() + offset * 86400000));
      const get = type => parts.find(p => p.type === type).value;
      return `${get('year')}-${get('month')}-${get('day')}`;
    };
    const prettyDate = iso => new Intl.DateTimeFormat('ko-KR', { timeZone:'Asia/Seoul', month:'long', day:'numeric', weekday:'short' }).format(new Date(`${iso}T12:00:00+09:00`));
    const escapeHtml = text => String(text ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    let menuData;

    function render(offset) {
      const date = seoulDate(offset);
      const meals = menuData?.days?.[date] || [];
      dateLabel.textContent = prettyDate(date);
      countLabel.textContent = meals.length ? `${meals.length}개 메뉴` : '';
      tabs.forEach(tab => tab.setAttribute('aria-selected', String(Number(tab.dataset.offset) === offset)));
      if (!meals.length) {
        list.innerHTML = '<div class="empty">등록된 메뉴가 없습니다.<br>주말·공휴일이거나 아직 식단이 게시되지 않았어요.</div>';
        return;
      }
      list.innerHTML = meals.map((meal, i) => `
        <article class="meal" style="animation-delay:${i * 25}ms">
          <div class="meal-kind"><strong>${escapeHtml(meal.kind)}</strong>${meal.price ? `<small>${escapeHtml(meal.price)}</small>` : ''}</div>
          <div><p class="meal-name">${escapeHtml(meal.name)}</p>${meal.detail ? `<p class="meal-detail">${escapeHtml(meal.detail)}</p>` : ''}</div>
        </article>`).join('');
    }

    tabs.forEach(tab => tab.addEventListener('click', () => render(Number(tab.dataset.offset))));
    fetch('./data/menu.json', { cache: 'no-store' })
      .then(response => { if (!response.ok) throw new Error(response.status); return response.json(); })
      .then(data => { menuData = data; updatedLabel.textContent = `마지막 확인 ${data.updatedAt || '알 수 없음'}`; render(0); })
      .catch(() => { dateLabel.textContent = '식단을 불러오지 못했어요'; countLabel.textContent = ''; list.innerHTML = '<div class="error">잠시 후 다시 시도하거나 오른쪽 위 ↗ 버튼으로 생협 원문을 확인해 주세요.</div>'; });

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
